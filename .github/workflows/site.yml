# Deploys the introduction site (packages/site) to Cloudflare Pages. CI (ci.yml) already builds and
# tests the site on every change; this only publishes it.
#
# It deploys only once the repository variable SITE_PAGES_PROJECT names the Pages project, with the
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID set. Until then every run builds the site
# and stops, so nothing is published before the site has somewhere to go.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      # The board at the top of the site is drawn by the library, so a library change redeploys it.
      # The gallery draws the sample boards in packages/samples.
      - 'packages/samples/**'
      - 'package-lock.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # Installing runs the workspace's postinstall, which builds the library the site's live board uses.
      - name: Install
        run: npm ci

      - name: Test
        run: npm test --workspace=packages/site

      - name: Build
        run: npm run build --workspace=packages/site

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.SITE_PAGES_PROJECT != '' && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/site/dist --project-name=${{ vars.SITE_PAGES_PROJECT }} --branch=main
