<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- This page's URL carries the share token in the query string; suppress the Referer header
         so the secret is never leaked to any origin a rendered widget happens to request. -->
    <meta name="referrer" content="no-referrer" />
    <title>U-Board — 공유 보드</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      /* The board view fills the window and follows its size. */
      html, body, #root { height: 100%; margin: 0; }
      #root { box-sizing: border-box; padding: 8px; }
      /* The page follows the system's light or dark, as the viewer's own text does — without a page
         color of its own, the viewer's dark-scheme text would sit on the browser's white. */
      :root { color-scheme: light dark; }
      body { background: #f8fafd; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
